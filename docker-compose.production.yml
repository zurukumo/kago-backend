services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.production
    command: .venv/bin/python manage.py runserver 0.0.0.0:${SERVER_PORT:-8000}
    env_file: .env
    tty: true
    depends_on:
      - redis
    networks:
      - proxy
    restart: unless-stopped

  redis:
    image: redis:7.2
    command: redis-server --appendonly yes --replica-read-only no
    ports:
      - 6379:6379
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:

networks:
  proxy:
    external: true
