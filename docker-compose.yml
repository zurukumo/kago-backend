services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    env_file: .env
    tty: true
    ports:
      - 8000:8000
    volumes:
      - .:/app
    depends_on:
      - redis

  redis:
    image: redis:7.2
    ports:
      - 6379:6379
    volumes:
      - redis-data:/data

volumes:
  redis-data:

